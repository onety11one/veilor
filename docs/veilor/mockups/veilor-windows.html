#veilor-preview .vl-app[data-design="console"] .vl-refresh-note {order:10}
@media(max-width:400px){#veilor-preview .vl-app{padding:24px 16px}}
#veilor-preview .vl-window {width:460px;max-width:100%;border:1px solid light-dark(#cbd3e1,#344052);border-radius:10px;overflow:hidden;background:light-dark(#fff,#131822);box-shadow:0 18px 55px light-dark(#18273f1c,#00000035)}
#veilor-preview .vl-titlebar {height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font:12px 'Segoe UI',sans-serif;color:light-dark(#586780,#a5afc6);border-bottom:1px solid light-dark(#e1e6ef,#293348)}
#veilor-preview .vl-window .vl-app {width:100%;max-width:none;border:0;border-radius:0;min-height:700px;font-family:'Segoe UI',system-ui,sans-serif;box-shadow:none}
#veilor-preview .vl-window .vl-app>* {flex-shrink:0}
#veilor-preview .vl-window .vl-head,#veilor-preview .vl-window .vl-profile,#veilor-preview .vl-window .vl-pay,#veilor-preview .vl-window .vl-actions,#veilor-preview .vl-window button[data-go="servers"] {width:100%;max-width:364px;align-self:center}
#veilor-preview .vl-progress-label {text-align:center;color:var(--vl-sub);font-size:13px;margin:4px 0}
#veilor-preview .vl-check {display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:54px;padding:12px 0;border-bottom:1px solid var(--vl-line)}
#veilor-preview .vl-check input {width:18px;height:18px;accent-color:var(--vl-accent)}
#veilor-preview .vl-app .vl-refresh-note {color:var(--vl-sub);padding:0 4px}
#veilor-preview .vl-app[data-design="ribbon"] .vl-center {text-align:center;padding:26px 20px}
#veilor-preview .vl-app[data-design="ribbon"] .vl-center .vl-title {text-align:center;overflow-wrap:anywhere}
#veilor-preview .vl-app[data-design="ribbon"] .vl-center .vl-desc {text-align:center;margin-inline:auto;min-height:0}
#veilor-preview .vl-app[data-design="ribbon"] .vl-center .vl-primary {display:flex;align-items:center;justify-content:center;width:var(--vl-control-width);max-width:100%;margin:18px auto 0;color:var(--vl-on)}
#veilor-preview .vl-app[data-design="ribbon"] .vl-center .vl-detail {display:flex;align-items:center;justify-content:center;min-width:140px;max-width:100%;margin:16px auto 0;padding:10px 20px;border:1px solid var(--vl-line);border-radius:8px;background:var(--vl-bg);color:var(--vl-fg)}
#veilor-preview .vl-app .vl-title,#veilor-preview .vl-app .vl-row span {overflow-wrap:anywhere}
#veilor-preview .vl-app .vl-row svg {flex-shrink:0}
</style>
<script>
(() => {
const root=document.getElementById('veilor-preview');
const modes={ready:['Не подключено','Выберите сервер и подключитесь','Подключить'],connecting:['Подключение…','Устанавливаем соединение с сервером','Подключение…'],connected:['Подключено','Соединение установлено','Отключить'],disconnecting:['Отключение…','Завершаем соединение','Отключение…'],expired:['Подписка закончилась','Продлите подписку, затем обновите подключение','Оплатить'],error:['Не удалось подключиться','Сервер не ответил. Попробуйте ещё раз.','Повторить'],empty:['Добавьте подключение','Импортируйте ссылку, QR-код или файл','Добавить подключение']};
const settings=[['Подключения','folder','profiles'],['Автоподключение','zap','auto'],['Оформление и доступность','palette','appearance'],['Резервные копии и синхронизация','cloud','backup'],['Расширенные настройки','sliders-horizontal','advanced'],['О приложении и помощь','info','about']];
const categories=[['Сеть и VPN','network'],['Маршрутизация','route'],['DNS','globe'],['Серверы и профили','server'],['Протоколы','layers'],['Диагностика','activity'],['Инструменты и интеграции','wrench'],['Система и обслуживание','settings'],['Прежний главный экран','layout-dashboard']];
const detailGroups={"Сеть и VPN":["TUN","Системный прокси","Исключения системного прокси","Порты","Доступ из локальной сети","Сетевые интерфейсы","IPv6 и стратегия IP","Исключения UWP","Брандмауэр Windows"],"Маршрутизация":["Наборы правил","Пользовательские правила","Группы маршрутизации","Проверка правил"],"DNS":["DNS-серверы","Автоматическая настройка","Стратегии DNS"],"Серверы и профили":["Редактор профиля","Объединение профилей","Порядок профилей","Автовыбор сервера","Фильтры серверов","Группы проверки задержки"],"Протоколы":["TLS","Мультиплексирование","WARP","NTP","Прочие параметры протоколов"],"Диагностика":["Соединения","Журналы","Проверка сети","Статистика трафика","Проверки утечек","Параметры тестирования"],"Инструменты и интеграции":["Веб-панель","User-Agent","QR-инструменты","Обработка ссылок","Провайдер","Apple TV"],"Система и обслуживание":["Поведение при выходе и сне","Портативный режим","Очистка кеша","Сброс настроек"],"Прежний главный экран":["Панель виджетов","Добавление и порядок виджетов","Фон и прозрачность","Импорт и экспорт виджетов"]};
function icon(name){return '<i data-lucide="'+name+'" aria-hidden="true"></i>'}
root.querySelectorAll('.vl-app').forEach(app=>{
 const state={mode:'ready',server:'Автоматически',page:'home',detail:'',routing:'rules',since:null,refreshing:false,refreshed:false,autopay:app.dataset.autopay==='true',paymentNotice:false,connectionColor:null,launch:false,autoconnect:false,refreshOutcome:'success'};
 const compact=app.dataset.layout==='compact';
 function row(name,ico,action){return '<button class="vl-row" data-go="'+action+'">'+icon(ico)+'<span>'+name+'</span>'+icon('chevron-right')+'</button>'}
 function render(){
  let markup=''; const m=modes[state.mode];
  if(state.page==='home'){
   markup='<header class="vl-head"><a class="vl-word" href="https://sigmagate.link/" target="_blank" rel="noopener noreferrer" aria-label="Veilor — открыть сайт">veilor<span style="color:var(--vl-accent)">.</span></a><div class="vl-head-actions"><a class="vl-icon" href="https://sigmagate.link/" target="_blank" rel="noopener noreferrer" aria-label="Поделиться — открыть сайт">'+icon('share-2')+'</a><button class="vl-icon" data-go="settings" aria-label="Настройки">'+icon('settings')+'</button></div></header>';
   if(state.mode!=='empty')markup+='<div class="vl-server vl-profile">'+icon('user')+'<span class="vl-servertext"><span class="vl-email">user@example.com</span><br><span class="vl-small">'+(state.mode==='expired'?'Подписка закончилась':'Действует до 16.12.2026')+'</span></span></div>'+('<button class="vl-pay" data-go="pay" '+(state.autopay?'disabled':'')+'>'+icon(state.autopay?'calendar-check':'credit-card')+'<span>'+(state.autopay?'Автоплатёж · 16.12.2026':'Оплатить')+'</span></button>'+(state.paymentNotice?'<p class="vl-payment-note" role="status">В приложении откроется страница оплаты. Это макет.</p>':''))+'<div class="vl-actions"><button class="vl-refresh" data-go="refresh" aria-label="Обновить подключение" data-tooltip="Обновить подключение" aria-busy="'+state.refreshing+'" '+(state.refreshing?'disabled':'')+'>'+icon('refresh-cw')+'<span class="vl-tool-label">'+(state.refreshing?'Обновление…':'Обновить')+'</span></button><a class="vl-speed" href="https://www.speedtest.net/" target="_blank" rel="noopener noreferrer" aria-label="Замер скорости — открыть Speedtest" data-tooltip="Замер скорости">'+icon('gauge')+'<span class="vl-tool-label">Скорость</span></a></div><p class="vl-refresh-note" role="status">'+(state.refreshed?(state.refreshOutcome==='success'?'Подключение обновлено':state.refreshOutcome==='partial'?'Конфигурация обновлена. Данные подписки недоступны.':'Не удалось обновить. Повторите попытку.') : '')+'</p>';
   markup+='<main><div class="vl-center">';
   if(state.mode==='empty') markup+='<div class="vl-emptyicon">'+icon('link')+'</div>';
   if(state.mode==='empty'||state.mode==='error'||state.mode==='expired')markup+='<h1 class="vl-title" aria-live="polite">'+m[0]+'</h1><p class="vl-desc">'+m[1]+'</p>';
   if(state.mode==='expired')markup+='<button class="vl-primary" data-go="pay">Оплатить</button>';
   else if(state.mode==='empty') markup+='<button class="vl-primary" data-go="import">Добавить подключение</button>';
   else markup+='<button class="vl-toggle" role="switch" aria-checked="'+(state.mode==='connected')+'" data-go="power" aria-label="Переключить подключение VPN" aria-busy="'+(['connecting','disconnecting'].includes(state.mode))+'" '+(['connecting','disconnecting'].includes(state.mode)?'disabled':'')+'><span class="vl-toggle-thumb">'+icon('power')+'</span></button>';
   if(['connecting','disconnecting'].includes(state.mode))markup+='<p class="vl-progress-label" role="status">'+m[0]+'</p>';
   if(state.mode==='error')markup+='<button class="vl-detail" data-go="error-detail">Подробнее</button>';
   markup+='</div>';
   if(state.mode!=='empty')markup+='<div class="vl-mode" role="group" aria-label="Режим маршрутизации"><button data-go="routing:rules" aria-pressed="'+(state.routing==='rules')+'">Игровой</button><button data-go="routing:global" aria-pressed="'+(state.routing==='global')+'">Рабочий</button></div>';
   if(state.mode!=='empty'){const status=state.connectionColor||(state.mode==='connected'?'connected':state.mode==='error'?'error':'off'); const names={connected:'Подключено',error:'Ошибка',off:'Отключено'};markup+='<div class="vl-stats"><div class="vl-stats-inner"><span class="vl-stat" aria-label="Использование оперативной памяти: 17,9 мегабайта">'+icon('cpu')+'<span>17,9 МБ</span></span><span class="vl-stat" aria-label="Время подключения">'+icon('clock')+'<span data-elapsed>00:00:00</span></span><button class="vl-connections" data-go="connections" data-status="'+status+'" aria-label="Соединения: '+(status==='connected'?3:0)+'. '+names[status]+'. Нажмите, чтобы сменить демонстрационный цвет.">'+icon('monitor')+'<span>'+(status==='connected'?3:0)+'</span></button></div></div>';}
   if(state.mode!=='empty'&&app.dataset.actions==='text'){const on=state.mode==='connected';markup+='<div class="vl-ip" data-online="'+on+'" role="status" aria-label="'+(on?'Подключено. Бельгия.':'Отключено. Россия.')+' Демонстрационный IP"><span class="vl-flag" data-country="'+(on?'be':'ru')+'" aria-hidden="true"></span><span>'+(on?'104.28.195.139':'85.175.198.94')+'</span></div>';}

   if(state.mode!=='empty')markup+='<button class="vl-server" data-go="servers">'+icon(state.server==='Автоматически'?'sparkles':'globe')+'<span class="vl-servertext"><span class="vl-small">Сервер</span><br>'+state.server+'</span>'+icon('chevron-right')+'</button>';
   markup+='</main>';
  }else{
   markup='<button class="vl-back" data-go="'+(['settings','servers','import'].includes(state.page)?'home':state.page==='category'?'advanced':state.page==='leaf'?(state.detail?'category':'settings'):'settings')+'">'+icon('arrow-left')+'Назад</button>';
   if(state.page==='settings')markup+='<h1 class="vl-title">Настройки</h1><div class="vl-list">'+settings.map(x=>row(...x)).join('')+'</div>';
   else if(state.page==='advanced')markup+='<h1 class="vl-title">Расширенные настройки</h1><p class="vl-small">Все возможности приложения</p><div class="vl-list">'+categories.map(x=>row(x[0],x[1],'cat:'+x[0])).join('')+'</div>';
   else if(state.page==='servers')markup+='<h1 class="vl-title">Выбор сервера</h1><p class="vl-small">Демонстрационный список</p><div class="vl-list">'+['Автоматически','Нидерланды · Amsterdam','Германия · Frankfurt'].map((s,i)=>row((s===state.server?'✓ ':'')+s,i?'globe':'sparkles','server:'+s)).join('')+'</div>';
   else if(state.page==='import')markup+='<h1 class="vl-title">Добавить подключение</h1><div class="vl-list">'+[['По ссылке','link'],['Сканировать QR-код','scan-line'],['Из файла','file-up']].map(x=>row(x[0],x[1],'demo-import')).join('')+'</div><p class="vl-small">В макете добавляется демонстрационный профиль.</p>';
   else if(state.page==='profiles')markup+='<h1 class="vl-title">Подключения</h1>'+row('Добавить подключение','plus','import')+(state.mode!=='empty'?row('Основное подключение','folder','profile-detail'):'');
   else if(state.page==='category')markup+='<h1 class="vl-title">'+state.detail+'</h1><div class="vl-list">'+(detailGroups[state.detail]||[]).map(label=>row(label,'sliders-horizontal','leaf:'+label)).join('')+'</div>';
   else if(state.page==='auto')markup+='<h1 class="vl-title">Автоподключение</h1><div class="vl-list"><label class="vl-check"><span>Запускать вместе с Windows</span><input type="checkbox" data-field="launch" '+(state.launch?'checked':'')+'></label><label class="vl-check"><span>Подключаться при запуске Veilor</span><input type="checkbox" data-field="autoconnect" '+(state.autoconnect?'checked':'')+'></label></div>';
   else if(state.page==='appearance')markup+='<h1 class="vl-title">Оформление и доступность</h1>'+row('Тема','palette','leaf:Тема')+row('Язык','languages','leaf:Язык')+row('Масштаб и доступность','accessibility','leaf:Масштаб и доступность');
   else if(state.page==='backup')markup+='<h1 class="vl-title">Копии и синхронизация</h1>'+['Создать копию','Восстановить копию','Автоматические копии','Локальная сеть','WebDAV'].map(x=>row(x,'cloud','leaf:'+x)).join('');
   else if(state.page==='leaf')markup+='<h1 class="vl-title">'+state.leaf+'</h1><p class="vl-small">На этапе реализации здесь откроется существующий экран Karing. Изменения системных параметров в макете не выполняются.</p>';
   else if(state.page==='error-detail')markup+='<h1 class="vl-title">Ошибка подключения</h1><p>Превышено время ожидания ответа сервера.</p><p class="vl-small">Демонстрационная ошибка. В приложении здесь будут фактическая причина и переход к диагностике.</p>'+row('Выбрать другой сервер','globe','servers');
   else markup+='<h1 class="vl-title">'+state.detail+'</h1><p class="vl-small">Детальный экран будет переиспользовать существующую логику приложения.</p>';
  }
  app.dataset.page=state.page;
  app.innerHTML=markup;
  updateTimer();
  if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
 }
 app.addEventListener('change',e=>{if(e.target.dataset.field)state[e.target.dataset.field]=e.target.checked;});
 app.addEventListener('click',e=>{
  const button=e.target.closest('button[data-go]'); if(!button)return; const action=button.dataset.go;
  if(action==='connections'){const current=state.connectionColor||(state.mode==='connected'?'connected':state.mode==='error'?'error':'off');state.connectionColor={off:'connected',connected:'error',error:'off'}[current];render();}
  else if(action==='pay'){state.paymentNotice=true;render();}
  else if(action.startsWith('routing:')){state.routing=action.slice(8);render();}
  else if(action==='refresh'){if(state.refreshing)return;state.refreshing=true;state.refreshed=false;render();setTimeout(()=>{state.refreshing=false;state.refreshed=true;render();},1300);}
  else if(action==='power'){
   state.connectionColor=null;
   if(state.mode==='connected'){state.mode='disconnecting';render();setTimeout(()=>{state.mode='ready';state.since=null;render();},800);}
   else {state.mode='connecting';render();setTimeout(()=>{if(state.mode==='connecting'){state.mode='connected';state.since=Date.now();render();}},1200);}
  }else if(action.startsWith('server:')){state.server=action.slice(7);state.page='home';render();}
  else if(action.startsWith('leaf:')){state.leaf=action.slice(5);state.page='leaf';render();}
  else if(action.startsWith('cat:')){state.detail=action.slice(4);state.page='category';render();}
  else if(action==='demo-import'){state.mode='ready';state.page='home';render();}
  else{state.page=action;state.detail=({auto:'Автоподключение',appearance:'Оформление и доступность',backup:'Резервные копии и синхронизация',about:'О приложении и помощь','profile-detail':'Основное подключение'})[action]||state.detail;render();}
 });
 function updateTimer(){const el=app.querySelector('[data-elapsed]');if(!el)return;if(state.mode==='connected'&&state.since===null)state.since=Date.now();const sec=state.mode==='connected'?Math.floor((Date.now()-state.since)/1000):0;el.textContent=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(n=>String(n).padStart(2,'0')).join(':');}
 const timer=setInterval(()=>{if(!app.isConnected){clearInterval(timer);return;}updateTimer();},1000);
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{state.page='home';render();}});tweak.addSelect(state,'refreshOutcome',{label:'Результат обновления',options:[{label:'Успех',value:'success'},{label:'Частичный успех',value:'partial'},{label:'Ошибка',value:'failure'}]});tweak.addToggle(state,'autopay',{label:'Автоподписка'});tweak.addSelect(state,'mode',{label:'Состояние подключения',options:[{label:'Не подключено',value:'ready'},{label:'Подключение',value:'connecting'},{label:'Подключено',value:'connected'},{label:'Отключение',value:'disconnecting'},{label:'Подписка закончилась',value:'expired'},{label:'Ошибка',value:'error'},{label:'Первый запуск',value:'empty'}]});}
});
})();
</script>
